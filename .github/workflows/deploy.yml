name: Build and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        working-directory: app
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Typecheck and unit tests
        working-directory: app
        run: |
          npx tsc -b --pretty false
          npx vitest run --pool=threads --maxWorkers=1 --passWithNoTests

      - name: Build
        working-directory: app
        env:
          VITE_BASE: /arushi-app/
        run: npx vite build

      - name: Publish build to the branch root
        run: |
          rm -rf assets
          cp -r app/dist/assets ./assets
          cp app/dist/index.html ./index.html
          cp app/dist/pcm-worklet.js ./pcm-worklet.js
          touch .nojekyll

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html assets pcm-worklet.js .nojekyll
          if git diff --cached --quiet; then
            echo "No site changes to publish"
            exit 0
          fi
          git commit -m "Publish built site [skip ci]"
          git push
