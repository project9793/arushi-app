name: Build Kotlin APK

on:
  push:
    branches: [main]
    paths:
      - 'kotlin/**'
      - '.github/workflows/kotlin-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kotlin-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android generates a fresh debug keystore on every new runner, so every
      # build used to be signed with a different key and refused to install over
      # the previous one. Caching the keystore keeps one signature for all builds.
      - name: Reuse the same debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arushi-debug-keystore-v1

      - name: Android SDK licences
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Install Gradle
        run: |
          set -u
          URLS=(
            "https://services.gradle.org/distributions/gradle-8.11.1-bin.zip"
            "https://downloads.gradle.org/distributions/gradle-8.11.1-bin.zip"
          )
          ok=0
          for url in "${URLS[@]}"; do
            for attempt in 1 2 3; do
              echo "Downloading $url (attempt $attempt)"
              if curl -fsSL --retry 3 --retry-all-errors --retry-delay 4 --max-time 180 \
                   -o /tmp/gradle.zip "$url" && unzip -tq /tmp/gradle.zip > /dev/null 2>&1; then
                unzip -q /tmp/gradle.zip -d /opt
                echo "/opt/gradle-8.11.1/bin" >> "$GITHUB_PATH"
                ok=1
                break 2
              fi
              sleep 6
            done
          done
          if [ "$ok" != "1" ]; then echo "could not download Gradle"; exit 1; fi

      - name: Build debug APK
        working-directory: kotlin
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"
            if /opt/gradle-8.11.1/bin/gradle assembleDebug --no-daemon --stacktrace; then
              exit 0
            fi
            sleep 15
          done
          exit 1

      - name: Show signing fingerprint
        run: |
          APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner 2>/dev/null | head -1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs kotlin/app/build/outputs/apk/debug/app-debug.apk | head -5
          fi

      - name: Collect APK
        run: cp kotlin/app/build/outputs/apk/debug/app-debug.apk arushi-kotlin-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arushi-kotlin-apk
          path: arushi-kotlin-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete kotlin-latest --yes --cleanup-tag || true
          gh release create kotlin-latest arushi-kotlin-debug.apk \
            --title "Arushi (Kotlin, native) - latest debug build" \
            --notes "Native Kotlin build. Debug-signed, sideload only. Commit ${{ github.sha }}"
