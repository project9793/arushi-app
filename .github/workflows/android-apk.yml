name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android-bridge/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Same keystore as every other build, otherwise Android refuses to install
      # this APK over the previous one (signature mismatch).
      - name: Reuse the same debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: arushi-debug-keystore-v1

      - name: Android SDK licences
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate the Android project
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: bash scripts/prepare-android.sh

      - name: Build debug APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"
            if ./gradlew assembleDebug --no-daemon --stacktrace; then exit 0; fi
            sleep 15
          done
          exit 1

      - name: Collect APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk arushi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arushi-apk
          path: arushi-debug.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest arushi-debug.apk \
            --title "Arushi APK - build ${{ github.run_number }}" \
            --notes "Version 1.${{ github.run_number }}. Debug-signed, sideload only. Commit ${{ github.sha }}"
