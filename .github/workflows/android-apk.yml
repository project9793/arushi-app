name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android-bridge/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Android project
        run: bash scripts/prepare-android.sh

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk arushi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arushi-debug-apk
          path: arushi-debug.apk

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest arushi-debug.apk \
            --title "Arushi APK (latest debug build)" \
            --notes "Signed with the debug keystore: sideload only, not for Play Store. Built from commit ${{ github.sha }}."
