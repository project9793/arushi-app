name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'android-bridge/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The ubuntu-latest image already ships an Android SDK. The setup-android
      # action tries to accept licences interactively and fails on a prompt, so
      # we just accept them ourselves and make sure the platform is present.
      - name: Android SDK licences and packages
        run: |
          SDKMANAGER="${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER=$(command -v sdkmanager); fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}/platforms" || true

      - name: Prepare Android project
        run: bash scripts/prepare-android.sh

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk arushi-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: arushi-debug-apk
          path: arushi-debug.apk

      - name: Publish release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest arushi-debug.apk \
            --title "Arushi APK (latest debug build)" \
            --notes "Debug-signed, sideload only. Built from commit ${{ github.sha }}."
